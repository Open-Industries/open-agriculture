asyncapi: 2.6.0
info:
  title: Open Agriculture — Reference Smart Farming Core Platform — Domain Events
  version: 1.0.0
  description: >
    CloudEvents 1.0 envelopes published by the platform's bounded contexts.
    Consumers MUST be idempotent and tolerate unknown fields. Ordering is
    guaranteed only per aggregate (the CloudEvent `subject`).
servers:
  production:
    url: kafka://broker.agriculture.svc.cluster.local:9092
    protocol: kafka
    description: Kafka-backed Knative Broker in production; Knative Broker abstraction elsewhere.
channels:
  field.created:
    publish:
      operationId: on-field-created
      message: { $ref: '#/components/messages/Generic' }
  irrigation.created:
    publish:
      operationId: on-irrigation-created
      message: { $ref: '#/components/messages/Generic' }
  agronomy.created:
    publish:
      operationId: on-agronomy-created
      message: { $ref: '#/components/messages/Generic' }
  machine.created:
    publish:
      operationId: on-machine-created
      message: { $ref: '#/components/messages/Generic' }
  notification.created:
    publish:
      operationId: on-notification-created
      message: { $ref: '#/components/messages/Generic' }
  health.evaluated:
    publish:
      operationId: on-health-evaluated
      message: { $ref: '#/components/messages/Generic' }
  yieldcheck.evaluated:
    publish:
      operationId: on-yieldcheck-evaluated
      message: { $ref: '#/components/messages/Generic' }
components:
  messages:
    Generic: { payload: { $ref: '#/components/schemas/CloudEvent' } }
  schemas:
    CloudEvent:
      type: object
      required: [specversion, id, source, type, time]
      properties:
        specversion: { type: string, enum: ['1.0'] }
        id: { type: string, format: uuid }
        source: { type: string, example: '/open-agriculture/service' }
        type: { type: string, example: 'context.event' }
        subject: { type: string, description: Aggregate id (ordering key). }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, enum: [application/json] }
        data: { type: object }
