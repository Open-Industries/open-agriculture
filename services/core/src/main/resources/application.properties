# Quarkus HTTP configuration for the Open Agriculture core service.
# Port precedence (same behavior as the previous standalone runtime):
#   quarkus.http.port <- core.port system property, then PORT env, then 8080.
# Knative injects PORT into the container, so a Knative deployment needs no
# extra configuration to pick up its assigned port.
quarkus.http.port=${core.port:${PORT:8080}}
quarkus.http.host=0.0.0.0
