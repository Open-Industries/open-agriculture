# agronomy-rules-service — Deployment + Service + HPA.
# Config arrives via environment variables (12-Factor III); secrets are referenced, never embedded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agronomy-rules-service
  namespace: agriculture
  labels: { app: agronomy-rules-service, app.kubernetes.io/part-of: open-agriculture }
spec:
  replicas: 2
  selector: { matchLabels: { app: agronomy-rules-service } }
  template:
    metadata:
      labels: { app: agronomy-rules-service }
    spec:
      containers:
        - name: agronomy-rules-service
          image: quay.io/open-industries/agronomy-rules-service:latest  # replaced by the promoted release digest
          ports: [{ containerPort: 8083, name: http }]
          env:
            - { name: HTTP_PORT, value: "8083" }
            - { name: LOG_LEVEL, value: "INFO" }
            - name: DB_URL
              valueFrom: { secretKeyRef: { name: agronomy-rules-service-db, key: url, optional: true } }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /q/health/live, port: http }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /q/health/ready, port: http }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agronomy-rules-service
  namespace: agriculture
  labels: { app: agronomy-rules-service }
spec:
  selector: { app: agronomy-rules-service }
  ports: [{ name: http, port: 8083, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agronomy-rules-service
  namespace: agriculture
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agronomy-rules-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
